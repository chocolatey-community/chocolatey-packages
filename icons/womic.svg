<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E6DA4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CC07E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A9A5A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Microphone body -->
  <rect x="44" y="28" width="40" height="48" rx="20" ry="20" fill="url(#micGradient)"/>
  
  <!-- Microphone stand -->
  <rect x="59" y="76" width="10" height="12" fill="#4A90D9"/>
  <path d="M 44 88 Q 64 100 84 88" stroke="#4A90D9" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Phone icon (representing the phone app) -->
  <rect x="80" y="40" width="28" height="44" rx="4" ry="4" fill="url(#phoneGradient)"/>
  <rect x="84" y="44" width="20" height="36" rx="2" ry="2" fill="#1A1A1A"/>
  
  <!-- Wireless waves from phone to mic -->
  <path d="M 78 52 Q 70 50 66 52" stroke="#4A90D9" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 78 64 Q 68 62 62 64" stroke="#4A90D9" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 78 76 Q 70 74 66 76" stroke="#4A90D9" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7"/>
  
  <!-- Mic grille lines -->
  <g stroke="#2E6DA4" stroke-width="1.5" opacity="0.8">
    <line x1="48" y1="36" x2="80" y2="36"/>
    <line x1="48" y1="42" x2="80" y2="42"/>
    <line x1="48" y1="48" x2="80" y2="48"/>
    <line x1="48" y1="54" x2="80" y2="54"/>
    <line x1="48" y1="60" x2="80" y2="60"/>
  </g>
  
  <!-- Small phone speaker at top -->
  <rect x="89" y="38" width="10" height="2" rx="1" fill="#3A9A5A" opacity="0.8"/>
</svg>